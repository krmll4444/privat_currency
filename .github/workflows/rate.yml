name: Rate engine

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - miniapp/**
      - widget/**
      - engine/**
      - package.json
      - .github/workflows/rate.yml

concurrency:
  group: rate-engine
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Fetch rates, history, Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIVAT_BUSINESS_TOKEN: ${{ secrets.PRIVAT_BUSINESS_TOKEN }}
          PRIVAT_BUSINESS_ID: ${{ secrets.PRIVAT_BUSINESS_ID }}
          SPREAD_THRESHOLD_PCT: ${{ vars.SPREAD_THRESHOLD_PCT }}
          NOTIFY_TOP_PCT: ${{ vars.NOTIFY_TOP_PCT }}
          TARGET_EUR: ${{ vars.TARGET_EUR }}
          NOTIFY_COOLDOWN_HOURS: ${{ vars.NOTIFY_COOLDOWN_HOURS }}
          NOTIFY_ERRORS: ${{ vars.NOTIFY_ERRORS }}
        run: node engine/index.mjs

      - name: Commit history
        run: bash engine/push-data.sh

      - name: Prepare Pages artifact
        run: |
          mkdir -p miniapp/data
          cp data/latest.json data/history.jsonl data/advice.json miniapp/data/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: miniapp

  pages:
    needs: fetch
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
